<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Scout dependency-free queue fixture</title>
<body style="margin:40px;background:#151923;color:#f2f4f8;font:18px system-ui">
<h1>Scout dependency-free queue fixture</h1>
<p>Amber asteroid: Asteroid A-17. Registration uses only window.__scoutGames.</p>
<canvas id="world" width="800" height="400" style="display:block;background:#202838"></canvas>
<pre id="status"></pre><pre id="geometry" style="position:fixed;top:8px;right:8px;width:420px;white-space:pre-wrap;font:11px/1.2 monospace;pointer-events:none;background:#0b1020ed"></pre>
<script>
const canvas = document.querySelector('canvas')
const context = canvas.getContext('2d')
window.highlights = []
window.draw = (ids = []) => {
  context.clearRect(0, 0, 800, 400)
  context.fillStyle = '#f2af50'
  context.beginPath(); context.arc(260, 180, 48, 0, Math.PI * 2); context.fill()
  if (ids.length) { context.strokeStyle = 'white'; context.lineWidth = 5; context.stroke() }
  context.fillStyle = 'white'; context.font = '20px system-ui'; context.fillText('Asteroid A-17', 195, 260)
}
draw()
window.makeGame = (name = 'Queue fixture') => ({
  v: 1, name, build: 'queue-v1', canvas,
  describe: ({x,y}) => Math.hypot(x - 260, y - 180) <= 48 ? {entity:{id:'asteroid-17',kind:'asteroid',label:'Asteroid A-17'},scene:'ring'} : null,
  snapshot: () => ({scene:'ring',seed:42,frame:120,clock:2,position:{x:12,y:4},save:{version:1,seed:42}}),
  highlight: ids => { highlights.push(ids); draw(ids); document.querySelector('#status').textContent = JSON.stringify(highlights) },
})
window.__scoutGames = window.__scoutGames || []
window.preGame = makeGame()
window.__scoutGames.push(preGame)
let screenOrigin = null
let pointSamples = 0
const geometry = () => {
  const b = canvas.getBoundingClientRect()
  const x = b.x + 260 * b.width / canvas.width, y = b.y + 180 * b.height / canvas.height
  const estimatedOrigin = {x:screenX+(outerWidth-innerWidth)/2,y:screenY+outerHeight-innerHeight}
  const origin = screenOrigin ?? estimatedOrigin
  const data = {canvasLocalCentre:{x:260,y:180},viewportCentre:{x,y},estimatedScreenCentre:{x:estimatedOrigin.x+x,y:estimatedOrigin.y+y},calibratedScreenCentre:screenOrigin?{x:screenOrigin.x+x,y:screenOrigin.y+y}:null,pointSamples,timing:window.__SCOUT_LOADER_TIMING__ ?? null}
  document.querySelector('#geometry').textContent = JSON.stringify(data,null,2)
  window.__SCOUT_QUEUE_FIXTURE__ = data
  return {x,y,screenX:origin.x+x,screenY:origin.y+y}
}
addEventListener('pointermove', e => {
  if (e.isTrusted) screenOrigin = {x:e.screenX-e.clientX,y:e.screenY-e.clientY}
  geometry()
})
if (new URLSearchParams(location.search).get('pointAt') === 'asteroid') {
  setInterval(() => {
    const p = geometry()
    canvas.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,pointerType:'mouse',pointerId:1,isPrimary:true,clientX:p.x,clientY:p.y,screenX:p.screenX,screenY:p.screenY}))
    pointSamples++
  },200)
}
setInterval(geometry,100)
geometry()
</script>
</body></html>
